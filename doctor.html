
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doctor Dashboard - Lucknow Health & Skin Care Centre</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <div class="sidebar">
    <h2>Lucknow Health & Skin Care Centre</h2>
    <div>
      <a href="index.html">Patient View</a>
      <a href="doctor.html">Doctor Dashboard</a>
    </div>
  </div>
  <div class="main">
    <div class="header">
      <h1>Doctor Dashboard</h1>
      <button id="addPatientBtn">+ New Patient</button>
    </div>
    <div class="token-cards">
      <div class="card"><h3>Current Token</h3><p id="currentToken">--</p></div>
      <div class="card"><h3>Next Token</h3><p id="nextToken">--</p></div>
      <div class="card"><h3>Remaining Tokens</h3><p id="remainingTokens">--</p></div>
    </div>
    <table border="0" cellspacing="0" cellpadding="10" width="100%">
      <thead>
        <tr style="text-align:left; background:rgba(0,120,215,0.1)">
          <th>Patient ID</th><th>Name</th><th>Age</th><th>Description</th><th>Token</th><th>Timestamp</th><th>Actions</th>
        </tr>
      </thead>
      <tbody id="patientList">
        <!-- Data will appear here -->
      </tbody>
    </table>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_AUTH_DOMAIN",
      databaseURL: "YOUR_DATABASE_URL",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_STORAGE_BUCKET",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };
    const app = firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    document.getElementById('addPatientBtn').onclick = () => alert('Add Patient popup will go here.');
  </script>
</body>
</html>
