<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Doctor Dashboard - Lucknow Health & Skin Care Centre</title>
  <link rel="stylesheet" href="style.css" />
  <script type="module">
    // 🔥 Import Firebase SDK
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import {
      getDatabase,
      ref,
      push,
      set,
      onValue,
      remove,
      update
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    import {
      getAuth,
      signInWithEmailAndPassword
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    // 🔑 Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyCJU3NHqAGbiZpNIDTLaEDxW4gblkCs7DQ",
      authDomain: "clinic-token-system-e1430.firebaseapp.com",
      databaseURL: "https://clinic-token-system-e1430-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "clinic-token-system-e1430",
      storageBucket: "clinic-token-system-e1430.firebasestorage.app",
      messagingSenderId: "1014958043227",
      appId: "1:1014958043227:web:c5a33675ddf76572274f7e"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);

    // Login Protection
    window.onload = function () {
      const email = "doctor@lhascc.com";
      const password = "LHASCC";
      signInWithEmailAndPassword(auth, email, password)
        .then(() => console.log("Doctor logged in automatically"))
        .catch((error) => console.error(error));
    };

    // Add Patient Modal
    function openModal() {
      document.getElementById("addPatientModal").style.display = "flex";
    }
    function closeModal() {
      document.getElementById("addPatientModal").style.display = "none";
    }

    // Add New Patient
    window.addPatient = function () {
      const name = document.getElementById("name").value.trim();
      const age = document.getElementById("age").value.trim();
      const mobile = document.getElementById("mobile").value.trim();
      const address = document.getElementById("address").value.trim();
      const illness = document.getElementById("illness").value.trim();

      if (!name || !mobile) {
        alert("Please enter patient name and mobile number.");
        return;
      }

      const patientsRef = ref(db, "patients");
      const newPatientRef = push(patientsRef);

      const patientData = {
        id: newPatientRef.key.slice(-5),
        name,
        age,
        mobile,
        address,
        illness,
        token: Date.now().toString().slice(-4),
        time: new Date().toISOString(),
      };

      set(newPatientRef, patientData);
      closeModal();
    };

    // Display Patients
    const tableBody = document.getElementById("patientTableBody");
    const patientsRef = ref(db, "patients");

    onValue(patientsRef, (snapshot) => {
      tableBody.innerHTML = "";
      snapshot.forEach((child) => {
        const p = child.val();
        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${p.id || "-"}</td>
          <td>${p.token || "-"}</td>
          <td>${p.name || "-"}</td>
          <td>${p.age || "-"}</td>
          <td>${p.mobile || "-"}</td>
          <td>${p.address || "-"}</td>
          <td>${p.illness || "-"}</td>
          <td>${p.time ? new Date(p.time).toLocaleString() : "-"}</td>
          <td>
            <button class="edit-btn" onclick="editPatient('${child.key}')">✏️</button>
            <button class="delete-btn" onclick="deletePatient('${child.key}')">🗑️</button>
          </td>
        `;
        tableBody.appendChild(row);
      });
    });

    // Edit Patient
    window.editPatient = function (id) {
      const newIllness = prompt("Update Illness / Description:");
      if (!newIllness) return;
      const patientRef = ref(db, `patients/${id}`);
      update(patientRef, { illness: newIllness });
    };

    // Delete Patient
    window.deletePatient = function (id) {
      if (confirm("Are you sure you want to delete this patient?")) {
        const patientRef = ref(db, `patients/${id}`);
        remove(patientRef);
      }
    };

    // Export CSV
    window.exportCSV = function () {
      let csv = "Patient ID,Token,Name,Age,Mobile,Address,Illness,Time\n";
      document.querySelectorAll("#patientTableBody tr").forEach((row) => {
        const cols = row.querySelectorAll("td");
        const data = Array.from(cols).map((td) => td.textContent);
        csv += data.join(",") + "\n";
      });
      const blob = new Blob([csv], { type: "text/csv" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "patients.csv";
      link.click();
    };
  </script>
</head>

<body>
  <h1 class="clinic-title">Lucknow Health & Skin Care Centre</h1>
  <h2 class="subtitle">Doctor Dashboard</h2>

  <div class="token-display">
    <div class="glass-card">
      <h3>Current Token</h3>
      <p id="currentToken">--</p>
    </div>
    <div class="glass-card">
      <h3>Next Token</h3>
      <p id="nextToken">--</p>
    </div>
    <div class="glass-card">
      <h3>Remaining</h3>
      <p id="remainingToken">--</p>
    </div>
  </div>

  <button class="add-patient-btn" onclick="openModal()">➕ Add Patient</button>

  <!-- Add Patient Modal -->
  <div id="addPatientModal" class="modal">
    <div class="modal-content glass-card">
      <span class="close-btn" onclick="closeModal()">✖</span>
      <h3>Add New Patient</h3>
      <input type="text" id="name" placeholder="Patient Name" />
      <input type="number" id="age" placeholder="Age" />
      <input type="text" id="mobile" placeholder="Mobile Number" />
      <input type="text" id="address" placeholder="Address" />
      <textarea id="illness" placeholder="Illness / Description"></textarea>
      <button onclick="addPatient()">Add Patient</button>
    </div>
  </div>

  <div class="table-container">
    <input
      type="text"
      id="searchInput"
      placeholder="Search patient..."
      onkeyup="searchPatient()"
      style="margin-bottom: 10px; padding: 8px; border-radius: 8px; width: 60%;"
    />
    <button onclick="exportCSV()" class="add-patient-btn" style="padding: 10px 20px;">Export CSV</button>

    <table>
      <thead>
        <tr>
          <th>Patient ID</th>
          <th>Token</th>
          <th>Name</th>
          <th>Age</th>
          <th>Mobile</th>
          <th>Address</th>
          <th>Illness</th>
          <th>Time</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="patientTableBody"></tbody>
    </table>
  </div>

  <script>
    function searchPatient() {
      const input = document.getElementById("searchInput").value.toLowerCase();
      document.querySelectorAll("#patientTableBody tr").forEach((row) => {
        const match = row.textContent.toLowerCase().includes(input);
        row.style.display = match ? "" : "none";
      });
    }
  </script>

  <footer style="margin: 20px 0; color: #333; font-size: 14px;">
    © 2025 Lucknow Health & Skin Care Centre
  </footer>
</body>
</html>
