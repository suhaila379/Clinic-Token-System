<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doctor Dashboard - Lucknow Health & Skin Care Centre</title>
  <style>
    body {
      font-family: "Poppins", sans-serif;
      background: linear-gradient(135deg, #e3f2fd, #ffffff);
      color: #0a2540;
      text-align: center;
      margin: 0;
      min-height: 100vh;
    }
    .clinic-title {
      margin: 20px auto;
      padding: 12px 25px;
      border-radius: 18px;
      background: rgba(255,255,255,0.3);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(255,255,255,0.6);
      box-shadow: 0 4px 15px rgba(0,153,255,0.25), inset 0 0 20px rgba(255,255,255,0.1);
      width: fit-content;
      animation: fadeIn 1s ease;
    }
    @keyframes fadeIn { from {opacity:0;} to {opacity:1;} }
    .subtitle { color: #4a90e2; }

    .token-display {
      display: flex; justify-content: center; gap: 15px;
      flex-wrap: wrap; margin: 20px auto;
    }
    .glass-card {
      backdrop-filter: blur(15px);
      background: rgba(255,255,255,0.3);
      border: 1px solid rgba(255,255,255,0.6);
      border-radius: 18px;
      box-shadow: 0 4px 15px rgba(0,153,255,0.2), inset 0 0 20px rgba(255,255,255,0.1);
      padding: 15px 25px;
      width: 180px;
      transition: 0.3s;
    }
    .glass-card:hover { transform: scale(1.03); }

    .add-btn {
      background: rgba(255,255,255,0.25);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.5);
      border-radius: 30px;
      cursor: pointer;
      font-size: 1em;
      color: #0a2540;
      padding: 12px 25px;
      box-shadow: 0 4px 12px rgba(0,153,255,0.2);
      margin-bottom: 25px;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.4);
      justify-content: center; align-items: center;
    }
    .modal-content {
      background: rgba(255,255,255,0.3);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(255,255,255,0.6);
      border-radius: 18px;
      padding: 20px;
      max-width: 400px;
      width: 90%;
      text-align: left;
      position: relative;
    }
    .close-btn { position: absolute; top: 8px; right: 12px; cursor: pointer; }
    input, textarea {
      width: 100%; margin: 6px 0; padding: 10px;
      border-radius: 10px; border: none; outline: none;
      font-size: 1em;
    }
    .table-container {
      margin: 0 auto; width: 95%; max-width: 1000px;
      background: rgba(255,255,255,0.25);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 15px;
    }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th, td { padding: 10px 12px; border-bottom: 1px solid rgba(255,255,255,0.5); }
    tr:hover { background: rgba(255,255,255,0.15); }
    .edit-btn, .delete-btn {
      background: none; border: none; cursor: pointer;
      font-size: 1.1em; margin: 0 5px;
    }
    .edit-btn:hover { color: #0078ff; }
    .delete-btn:hover { color: #e60000; }
  </style>
</head>
<body>
  <h1 class="clinic-title">Lucknow Health & Skin Care Centre</h1>
  <h2 class="subtitle">Doctor Dashboard</h2>

  <div class="token-display">
    <div class="glass-card"><h3>Current</h3><p id="currentToken">--</p></div>
    <div class="glass-card"><h3>Next</h3><p id="nextToken">--</p></div>
    <div class="glass-card"><h3>Remaining</h3><p id="remainingToken">--</p></div>
  </div>

  <button class="add-btn" onclick="openModal()">➕ Add Patient</button>

  <!-- Modal -->
  <div id="modal" class="modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal()">✖</span>
      <h3 id="modalTitle">Add Patient</h3>
      <input id="pName" placeholder="Name">
      <input id="pAge" placeholder="Age" type="number">
      <input id="pMobile" placeholder="Mobile">
      <input id="pAddress" placeholder="Address">
      <textarea id="pIllness" placeholder="Illness / Description"></textarea>
      <button class="add-btn" onclick="savePatient()">Save</button>
    </div>
  </div>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>Patient ID</th>
          <th>Token</th>
          <th>Name</th>
          <th>Age</th>
          <th>Mobile</th>
          <th>Address</th>
          <th>Illness</th>
          <th>Time</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getDatabase, ref, set, get, remove, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCJU3NHqAGbiZpNIDTLaEDxW4gblkCs7DQ",
      authDomain: "clinic-token-system-e1430.firebaseapp.com",
      databaseURL: "https://clinic-token-system-e1430-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "clinic-token-system-e1430",
      storageBucket: "clinic-token-system-e1430.firebasestorage.app",
      messagingSenderId: "1014958043227",
      appId: "1:1014958043227:web:c5a33675ddf76572274f7e"
    };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);
    signInWithEmailAndPassword(auth, "doctor@lhascc.com", "LHASCC");

    const modal = document.getElementById("modal");
    const tableBody = document.getElementById("tableBody");
    let editKey = null;

    window.openModal = function() {
      modal.style.display = "flex";
      document.getElementById("modalTitle").textContent = "Add Patient";
      ["pName","pAge","pMobile","pAddress","pIllness"].forEach(id=>document.getElementById(id).value="");
      editKey = null;
    };
    window.closeModal = function() { modal.style.display = "none"; };

    onValue(ref(db,"tokens/current"), s => document.getElementById("currentToken").textContent = s.val()||"--");
    onValue(ref(db,"tokens/next"), s => document.getElementById("nextToken").textContent = s.val()||"--");
    onValue(ref(db,"tokens/remaining"), s => document.getElementById("remainingToken").textContent = s.val()||"--");

    window.savePatient = async function() {
      const name = pName.value.trim();
      if (!name) return alert("Please enter patient name");
      const snap = await get(ref(db,"patients"));
      const data = snap.val()||{};
      const id = editKey ? editKey : Object.keys(data).length+1;
      const token = id;
      const info = { id, token, name, age:pAge.value, mobile:pMobile.value, address:pAddress.value, illness:pIllness.value, time:new Date().toLocaleString() };
      await set(ref(db,"patients/"+id), info);
      await set(ref(db,"tokens/current"), token);
      await set(ref(db,"tokens/next"), token+1);
      await set(ref(db,"tokens/remaining"), Object.keys(data).length+1);
      closeModal();
    };

    onValue(ref(db,"patients"), snap => {
      const patients = snap.val() || {};
      tableBody.innerHTML = "";
      Object.values(patients).forEach(p => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${p.id}</td><td>${p.token}</td><td>${p.name}</td>
          <td>${p.age}</td><td>${p.mobile}</td><td>${p.address}</td>
          <td>${p.illness}</td><td>${p.time}</td>
          <td>
            <button class="edit-btn" onclick="editPatient(${p.id})">✏️</button>
            <button class="delete-btn" onclick="deletePatient(${p.id})">🗑️</button>
          </td>`;
        tableBody.appendChild(tr);
      });
    });

    window.editPatient = function(id) {
      get(ref(db,"patients/"+id)).then(s => {
        const d = s.val(); if (!d) return;
        editKey = id;
        modal.style.display = "flex";
        modalTitle.textContent = "Edit Patient";
        pName.value = d.name; pAge.value = d.age; pMobile.value = d.mobile;
        pAddress.value = d.address; pIllness.value = d.illness;
      });
    };

    window.deletePatient = function(id) {
      if (confirm("Delete this record?")) remove(ref(db,"patients/"+id));
    };
  </script>
</body>
</html>
