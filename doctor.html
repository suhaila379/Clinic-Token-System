<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lucknow Health And Skin Care Centre - Doctor Dashboard</title>
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <header class="header-glass">
    <h1>Lucknow Health And Skin Care Centre</h1>
  </header>
  <aside class="sidebar">
    <nav>
      <a href="index.html">Go to Patient View</a>
      <a href="#" class="active">Doctor Dashboard</a>
    </nav>
  </aside>

  <main class="main-content">
    <div class="search-bar">
      <input type="text" placeholder="Search by Name or Mobile..." />
      <input type="date" />
      <input type="number" placeholder="Token No." />
    </div>

    <table class="patient-table">
      <thead>
        <tr>
          <th>Patient ID</th>
          <th>Name</th>
          <th>Age</th>
          <th>Issue / Description</th>
          <th>Token No.</th>
          <th>Date</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>PID001</td>
          <td>Ravi Kumar</td>
          <td>32</td>
          <td>Skin Allergy</td>
          <td>05</td>
          <td>2025-11-04</td>
          <td><button class="add-btn">Edit</button></td>
        </tr>
        <tr>
          <td>PID002</td>
          <td>Anjali Sharma</td>
          <td>27</td>
          <td>Hair Treatment</td>
          <td>06</td>
          <td>2025-11-04</td>
          <td><button class="add-btn">Edit</button></td>
        </tr>
      </tbody>
    </table>
  </main>

  <script src="assets/js/app.js"></script>
</body>
</html>
