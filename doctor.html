<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Doctor Dashboard – LHASCC</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="doctor-body">

<div id="loginBox" class="login-box">
  <h2>Doctor Login</h2>
  <input type="email" id="email" value="doctor@lhascc.com">
  <input type="password" id="password" placeholder="Password">
  <button id="loginBtn">Login</button>
  <p id="errorMsg" style="color:red;"></p>
</div>

<div id="dashboard" style="display:none;">
  <header class="header">
    <h1>Doctor Dashboard</h1>
    <button id="logoutBtn" class="logout">Logout</button>
  </header>

  <div class="token-cards">
    <div class="card"><h3>Current Token</h3><p id="currentToken">--</p></div>
    <div class="card"><h3>Next Token</h3><p id="nextToken">--</p></div>
    <div class="card"><h3>Remaining</h3><p id="remainingTokens">--</p></div>
  </div>

  <div class="form-card">
    <h3>Add / Edit Patient</h3>
    <input id="pId" placeholder="Patient ID (auto)" disabled>
    <input id="pName" placeholder="Name">
    <input id="pAge" placeholder="Age">
    <input id="pMobile" placeholder="Mobile">
    <input id="pAddress" placeholder="Address">
    <textarea id="pIllness" placeholder="Illness / Description"></textarea>
    <button id="generateBtn">Generate / Update</button>
  </div>

  <div class="table-actions">
    <input type="text" id="searchBox" class="search-bar" placeholder="Search...">
    <button id="downloadCSV" class="download-btn">⬇️ CSV</button>
  </div>

  <table class="patient-table" id="patientTable">
    <thead><tr>
      <th>Patient ID</th><th>Token</th><th>Name</th><th>Age</th>
      <th>Mobile</th><th>Address</th><th>Illness</th><th>Timestamp</th><th>Edit</th>
    </tr></thead>
    <tbody id="patientList"></tbody>
  </table>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getDatabase,ref,set,onValue,get,child,update} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const app = initializeApp({
 apiKey:"AIzaSyCJU3NHqAGbiZpNIDTLaEDxW4gblkCs7DQ",
 authDomain:"clinic-token-system-e1430.firebaseapp.com",
 databaseURL:"https://clinic-token-system-e1430-default-rtdb.asia-southeast1.firebasedatabase.app",
 projectId:"clinic-token-system-e1430",
 storageBucket:"clinic-token-system-e1430.firebasestorage.app",
 messagingSenderId:"1014958043227",
 appId:"1:1014958043227:web:c5a33675ddf76572274f7e"
});

const auth=getAuth(app);const db=getDatabase(app);
const loginBox=document.getElementById("loginBox"),dash=document.getElementById("dashboard"),toast=document.getElementById("toast");

function msg(t){toast.textContent=t;toast.style.display="block";setTimeout(()=>toast.style.display="none",2500);}

document.getElementById("loginBtn").onclick=()=>signInWithEmailAndPassword(auth,email.value,password.value)
 .then(()=>{loginBox.style.display="none";dash.style.display="block";load();})
 .catch(()=>errorMsg.textContent="Incorrect credentials");

logoutBtn.onclick=()=>signOut(auth);
onAuthStateChanged(auth,u=>{if(u){loginBox.style.display="none";dash.style.display="block";load();}else{dash.style.display="none";loginBox.style.display="block";}});

async function load(){
 onValue(ref(db,"tokens/current"),s=>currentToken.textContent=s.val()??"--");
 onValue(ref(db,"tokens/next"),s=>nextToken.textContent=s.val()??"--");
 onValue(ref(db,"tokens/remaining"),s=>remainingTokens.textContent=s.val()??"--");
 onValue(ref(db,"patients"),s=>render(s.val()||{}));
}

generateBtn.onclick=async()=>{
 const snap=await get(child(ref(db),"patients"));const all=snap.val()||{};
 let id=pId.value||"P"+String(Object.keys(all).length+1).padStart(3,"0");
 let token="T"+String(Object.keys(all).length+1).padStart(3,"0");
 const data={patientId:id,token:token,name:pName.value,age:pAge.value,mobile:pMobile.value,address:pAddress.value,illness:pIllness.value,timestamp:new Date().toLocaleString()};
 await set(ref(db,"patients/"+id),data);
 await set(ref(db,"tokens/current"),token);
 await set(ref(db,"tokens/next"),"T"+String(Object.keys(all).length+2).padStart(3,"0"));
 msg("Saved "+id); pId.value=pName.value=pAge.value=pMobile.value=pAddress.value=pIllness.value="";
};

function render(d){
 const list=document.getElementById("patientList");list.innerHTML="";
 Object.values(d).forEach(p=>{
  const tr=document.createElement("tr");
  ["patientId","token","name","age","mobile","address","illness","timestamp"].forEach(k=>{
   const td=document.createElement("td");td.textContent=p[k]||"";tr.appendChild(td);
  });
  const editTd=document.createElement("td");
  editTd.innerHTML="✏️";editTd.style.cursor="pointer";
  editTd.onclick=()=>{pId.value=p.patientId;pName.value=p.name||"";pAge.value=p.age||"";pMobile.value=p.mobile||"";pAddress.value=p.address||"";pIllness.value=p.illness||"";window.scrollTo({top:0,behavior:'smooth'});}
  tr.appendChild(editTd);
  list.appendChild(tr);
 });
}

searchBox.oninput=e=>{
 const v=e.target.value.toLowerCase();
 document.querySelectorAll("#patientList tr").forEach(tr=>tr.style.display=tr.textContent.toLowerCase().includes(v)?"":"none");
};

downloadCSV.onclick=()=>{
 const rows=[["Patient ID","Token","Name","Age","Mobile","Address","Illness","Timestamp"]];
 patientList.querySelectorAll("tr").forEach(tr=>{
  const row=[];tr.querySelectorAll("td").forEach(td=>row.push(td.textContent));rows.push(row);
 });
 const blob=new Blob([rows.map(r=>r.join(",")).join("\\n")],{type:"text/csv"});
 const a=document.createElement("a");a.href=URL.createObjectURL(blob);
 a.download=`patients_${new Date().toISOString().slice(0,10)}.csv`;a.click();
};
</script>
</body>
</html>
