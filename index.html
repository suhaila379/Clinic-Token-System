<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lucknow Health & Skin Care Centre</title>
  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #e3f2fd, #ffffff);
      color: #0a2540;
      text-align: center;
      min-height: 100vh;
      overflow-x: hidden;
    }
    .clinic-title {
      margin: 20px auto;
      padding: 12px 25px;
      width: fit-content;
      border-radius: 18px;
      background: rgba(255,255,255,0.3);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(255,255,255,0.6);
      box-shadow: 0 4px 15px rgba(0,153,255,0.25), inset 0 0 20px rgba(255,255,255,0.1);
      font-weight: 600;
      letter-spacing: 0.5px;
      transition: 0.3s;
      animation: fadeIn 1s ease;
    }
    .clinic-title:hover { transform: scale(1.02); }
    @keyframes fadeIn { from {opacity:0;} to {opacity:1;} }

    .form-card {
      backdrop-filter: blur(15px);
      background: rgba(255,255,255,0.3);
      border: 1px solid rgba(255,255,255,0.6);
      border-radius: 18px;
      box-shadow: 0 4px 15px rgba(0,153,255,0.2), inset 0 0 20px rgba(255,255,255,0.1);
      padding: 20px;
      width: 90%;
      max-width: 400px;
      margin: 20px auto;
      transition: all 0.3s ease;
    }
    input, textarea {
      width: 90%;
      padding: 10px;
      margin: 8px 0;
      border: none;
      border-radius: 10px;
      font-size: 1em;
      outline: none;
      transition: box-shadow 0.3s ease;
    }
    input.error, textarea.error {
      box-shadow: 0 0 8px 2px rgba(255, 0, 0, 0.6);
    }
    button {
      background: rgba(255,255,255,0.25);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.5);
      padding: 12px 25px;
      border-radius: 30px;
      cursor: pointer;
      font-size: 1em;
      color: #0a2540;
      box-shadow: 0 4px 12px rgba(0,153,255,0.2);
      transition: 0.3s;
    }
    button:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 20px rgba(0,153,255,0.35);
    }
    .token-display {
      margin-top: 30px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
    }
    .glass-card {
      backdrop-filter: blur(15px);
      background: rgba(255, 255, 255, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: 18px;
      box-shadow: 0 4px 15px rgba(0, 153, 255, 0.2), inset 0 0 20px rgba(255,255,255,0.1);
      padding: 15px 25px;
      width: 180px;
    }
    .glass-card h3 { margin: 0; font-size: 1em; font-weight: 600; }
    .glass-card p { font-size: 1.4em; margin: 5px 0 0; font-weight: 500; }

    .login-btn {
      margin: 25px auto;
      display: inline-block;
      background: rgba(255,255,255,0.3);
      backdrop-filter: blur(10px);
      padding: 10px 25px;
      border-radius: 25px;
      border: 1px solid rgba(255,255,255,0.6);
      cursor: pointer;
      font-weight: 500;
      color: #0a2540;
      transition: 0.3s;
    }
    .login-btn:hover { box-shadow: 0 4px 15px rgba(0,153,255,0.3); }

    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      justify-content: center;
      align-items: center;
      background: rgba(0,0,0,0.4);
      z-index: 1000;
    }
    .modal-content {
      backdrop-filter: blur(15px);
      background: rgba(255,255,255,0.3);
      border: 1px solid rgba(255,255,255,0.6);
      border-radius: 18px;
      box-shadow: 0 4px 15px rgba(0,153,255,0.3);
      padding: 25px;
      text-align: center;
      width: 90%;
      max-width: 350px;
    }
    .close-btn {
      position: absolute;
      right: 20px;
      top: 10px;
      font-size: 1.2em;
      cursor: pointer;
    }

    footer { margin: 30px; color: #333; font-size: 13px; }
  </style>
</head>
<body>
  <h1 class="clinic-title">Lucknow Health & Skin Care Centre</h1>

  <div class="form-card" id="formCard">
    <h2>Get Your Token / अपना टोकन प्राप्त करें</h2>
    <input id="name" placeholder="Name / नाम" required>
    <input id="age" type="number" placeholder="Age / उम्र" required>
    <input id="mobile" placeholder="Mobile / मोबाइल" required>
    <input id="address" placeholder="Address / पता" required>
    <textarea id="illness" placeholder="Illness / बीमारी" required></textarea>
    <button id="getTokenBtn">Get Token</button>
  </div>

  <div class="token-display" id="tokenSection" style="display:none;">
    <div class="glass-card">
      <h3>Your Token / आपका टोकन</h3>
      <p id="yourToken">--</p>
    </div>
    <div class="glass-card">
      <h3>Current Serving / वर्तमान टोकन</h3>
      <p id="currentToken">--</p>
    </div>
  </div>

  <div>
    <button class="login-btn" onclick="openLogin()">👨‍⚕️ Doctor Login</button>
  </div>

  <div id="loginModal" class="modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeLogin()">✖</span>
      <h3>Doctor Login</h3>
      <input type="email" id="loginEmail" placeholder="Email" value="doctor@lhascc.com" />
      <input type="password" id="loginPass" placeholder="Password" />
      <button onclick="doctorLogin()">Login</button>
    </div>
  </div>

  <footer>© 2025 Lucknow Health & Skin Care Centre</footer>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getDatabase, ref, get, set, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCJU3NHqAGbiZpNIDTLaEDxW4gblkCs7DQ",
      authDomain: "clinic-token-system-e1430.firebaseapp.com",
      databaseURL: "https://clinic-token-system-e1430-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "clinic-token-system-e1430",
      storageBucket: "clinic-token-system-e1430.appspot.com",
      messagingSenderId: "1014958043227",
      appId: "1:1014958043227:web:c5a33675ddf76572274f7e"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);

    // get references to inputs (module scope - must use getElementById)
    const nameInput = document.getElementById('name');
    const ageInput = document.getElementById('age');
    const mobileInput = document.getElementById('mobile');
    const addressInput = document.getElementById('address');
    const illnessInput = document.getElementById('illness');
    const getTokenBtn = document.getElementById('getTokenBtn');

    // Live update for current serving token
    onValue(ref(db, "tokens/current"), snap => {
      document.getElementById("currentToken").textContent = snap.val() || "--";
    });

    // helper to flash required fields (red) — no popup
    function flashErrors(inputs) {
      inputs.forEach(i => {
        i.classList.add('error');
      });
      setTimeout(() => inputs.forEach(i => i.classList.remove('error')), 1800);
    }

    // Generate new token — bound to button
    async function handleGetToken() {
      const inputs = [nameInput, ageInput, mobileInput, addressInput, illnessInput];
      const missing = inputs.filter(i => !i.value || !i.value.toString().trim());
      if (missing.length) {
        flashErrors(missing);
        return;
      }

      try {
        // fetch current patients (keys are numeric strings)
        const snap = await get(ref(db, "patients"));
        const data = snap.val() || {};

        // compute next numeric id (handles existing numeric keys)
        const ids = Object.keys(data).map(k => parseInt(k, 10)).filter(n => !isNaN(n));
        const newId = ids.length ? Math.max(...ids) + 1 : 1;

        const info = {
          id: newId,
          token: newId,
          name: nameInput.value.trim(),
          age: ageInput.value.trim(),
          mobile: mobileInput.value.trim(),
          address: addressInput.value.trim(),
          illness: illnessInput.value.trim(),
          time: new Date().toLocaleString()
        };

        // write patient using numeric key
        await set(ref(db, "patients/" + newId), info);

        // update token tracking nodes
        await set(ref(db, "tokens/current"), newId);
        await set(ref(db, "tokens/next"), newId + 1);
        // remaining can be count of waiting (keep same semantics as earlier)
        const remainingCount = (Object.keys(data).length) + 1;
        await set(ref(db, "tokens/remaining"), remainingCount);

        // show user's token
        document.getElementById("formCard").style.display = "none";
        document.getElementById("tokenSection").style.display = "flex";
        document.getElementById("yourToken").textContent = newId;
      } catch (err) {
        console.error("Failed to write token:", err);
        // keep UI silent per your request — but log for debugging
      }
    }

    // bind click event
    getTokenBtn.addEventListener('click', handleGetToken);

    // login modal handlers (unchanged)
    window.openLogin = () => document.getElementById("loginModal").style.display = "flex";
    window.closeLogin = () => document.getElementById("loginModal").style.display = "none";

    window.doctorLogin = async () => {
      const email = document.getElementById("loginEmail").value;
      const pass = document.getElementById("loginPass").value;
      try {
        await signInWithEmailAndPassword(auth, email, pass);
        window.location.href = "doctor.html";
      } catch {
        // keep the same behaviour you used earlier
        alert("Invalid credentials. Please try again.");
      }
    };
  </script>
</body>
</html>
