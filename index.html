  <style>
    body{font-family:Arial, sans-serif;margin:0;background:#f5f8ff;display:flex;justify-content:center;align-items:center;min-height:100vh}
    .card{background:#fff;padding:20px;border-radius:10px;box-shadow:0 4px 10px rgba(0,0,0,0.1);width:90%;max-width:500px}
    h1{text-align:center;color:#064789}
    label{display:block;margin-top:10px;font-weight:bold}
    input,textarea{width:100%;padding:8px;margin-top:4px;border:1px solid #ccc;border-radius:6px;font-size:15px}
    button{margin-top:15px;width:100%;padding:10px;font-size:16px;background:#064789;color:#fff;border:none;border-radius:6px;cursor:pointer}
    button:hover{background:#0b74db}
    #tokenBox{margin-top:15px;padding:10px;background:#e8f4ff;border-radius:6px;text-align:center;font-weight:bold;color:#064789}
    .bilingual{font-size:13px;color:#555}
  </style>
</head>
<body>
  <div class="card">
    <h1>Get Token / टोकन प्राप्त करें</h1>
    <form id="patientForm">
      <label>Name / नाम</label>
      <input id="name" required placeholder="Enter full name / पूरा नाम दर्ज करें">

      <label>Mobile Number / मोबाइल नंबर</label>
      <input id="mobile" required placeholder="10-digit mobile number / 10 अंकों का मोबाइल नंबर">

      <label>Location / स्थान</label>
      <input id="location" required placeholder="Your area or city / आपका क्षेत्र या शहर">

      <label>Illness Details / रोग का विवरण</label>
      <textarea id="illness" required placeholder="Describe briefly / संक्षेप में विवरण दें"></textarea>

      <button type="submit">Get Token / टोकन प्राप्त करें</button>
    </form>
    <div id="tokenBox" style="display:none"></div>
  </div>

      if(!name||!mobile||!location||!illness){alert('Please fill all fields');return;}
