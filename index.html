<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Patient Token System</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #eef3f8;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    h1 {
      color: #333;
      margin-bottom: 10px;
      text-align: center;
    }
    button {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 15px 30px;
      font-size: 18px;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover {
      background-color: #0056b3;
    }
    #tokenDisplay {
      margin-top: 30px;
      font-size: 24px;
      color: #222;
      text-align: center;
    }
    footer {
      position: absolute;
      bottom: 20px;
      font-size: 12px;
      color: #888;
    }
  </style>
</head>
<body>
  <h1>Get Your Patient Token</h1>
  <button id="getToken">Get Token</button>
  <div id="tokenDisplay"></div>

  <footer>© 2025 Patient Token System</footer>

  <script>
    // Manage patient token count locally (per device)
    let currentToken = localStorage.getItem("currentToken") || 0;

    document.getElementById("getToken").addEventListener("click", () => {
      currentToken++;
      localStorage.setItem("currentToken", currentToken);
      document.getElementById("tokenDisplay").innerHTML = 
        "Your Token Number: <b>" + currentToken + "</b>";
    });
  </script>
</body>
</html>
