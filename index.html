<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lucknow Health & Skin Care Centre – Patient Token</title>
<link rel="stylesheet" href="style.css" />
</head>
<body class="patient-body">
<div class="container">
  <h1 class="clinic-title">Lucknow Health & Skin Care Centre</h1>
  <h2 class="subtitle">Get Your Token / अपना टोकन प्राप्त करें</h2>

  <div class="form-card">
    <label>Patient Name / मरीज का नाम</label>
    <input id="pName" placeholder="Enter patient name / मरीज का नाम दर्ज करें" required />

    <label>Age / उम्र</label>
    <input id="pAge" placeholder="Age / उम्र" type="number" />

    <label>Mobile Number / मोबाइल नंबर</label>
    <input id="pMobile" placeholder="Enter mobile number / मोबाइल नंबर दर्ज करें" type="tel" />

    <label>Address / पता</label>
    <input id="pAddress" placeholder="Enter address / पता दर्ज करें" />

    <label>Illness / बीमारी का विवरण</label>
    <textarea id="pIllness" placeholder="Describe illness / बीमारी का विवरण दें"></textarea>

    <button id="generateBtn">Generate Token / टोकन बनाएं</button>
  </div>

  <div class="token-display" id="tokenDisplay" style="display:none;">
    <div class="token-card glass-card">
      <h3>Your Token Number / आपका टोकन नंबर</h3>
      <p id="patientToken">--</p>
    </div>
    <div class="token-card glass-card">
      <h3>Currently Serving / वर्तमान सेवा टोकन</h3>
      <p id="currentToken">--</p>
    </div>
  </div>

  <button class="doctor-login-btn" onclick="window.location.href='doctor.html'">
    👨‍⚕️ Doctor Login / डॉक्टर लॉगिन
  </button>
</div>

<footer class="footer">© 2025 Lucknow Health & Skin Care Centre</footer>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, set, onValue, get, child } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

// Firebase config
const app = initializeApp({
  apiKey: "AIzaSyCJU3NHqAGbiZpNIDTLaEDxW4gblkCs7DQ",
  authDomain: "clinic-token-system-e1430.firebaseapp.com",
  databaseURL: "https://clinic-token-system-e1430-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "clinic-token-system-e1430",
  storageBucket: "clinic-token-system-e1430.firebasestorage.app",
  messagingSenderId: "1014958043227",
  appId: "1:1014958043227:web:c5a33675ddf76572274f7e"
});

const db = getDatabase(app);

const patientToken = document.getElementById("patientToken");
const currentToken = document.getElementById("currentToken");
const tokenDisplay = document.getElementById("tokenDisplay");
const generateBtn = document.getElementById("generateBtn");

onValue(ref(db, "tokens/current"), (snapshot) => {
  const val = snapshot.val();
  currentToken.textContent = val ? val : "--";
});

generateBtn.onclick = async () => {
  const name = pName.value.trim();
  if (!name) {
    alert("Please enter patient name / कृपया मरीज का नाम दर्ज करें");
    return;
  }
  const snap = await get(child(ref(db), "patients"));
  const all = snap.val() || {};
  const last = Object.keys(all).length ? Object.keys(all)[Object.keys(all).length - 1] : "P000";
  const num = parseInt(last.replace("P", "")) + 1;
  const patientId = "P" + String(num).padStart(3, "0");
  const token = "T" + String(num).padStart(3, "0");
  const data = {
    patientId,
    token,
    name,
    age: pAge.value,
    mobile: pMobile.value,
    address: pAddress.value,
    illness: pIllness.value,
    timestamp: new Date().toLocaleString(),
  };

  await set(ref(db, "patients/" + patientId), data);
  await set(ref(db, "tokens/current"), token);
  await set(ref(db, "tokens/next"), "T" + String(num + 1).padStart(3, "0"));
  await set(ref(db, "tokens/remaining"), Object.keys(all).length + 1);

  tokenDisplay.style.display = "flex";
  patientToken.textContent = token;

  pName.value = pAge.value = pMobile.value = pAddress.value = pIllness.value = "";
};
</script>
</body>
</html>
